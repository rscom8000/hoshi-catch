<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星キャッチ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: full-height night-sky game. Slim score bar on top, canvas fills the rest, a centered panel for start / game over / clear. */
:root {
  --sky: #0b1030;
  --sky-2: #1c2260;
  --lantern: #ffd36b;
  --ember: #ff6a4d;
  --ink: #f3efe2;
  --mute: #9aa3d6;
  --panel: rgba(11, 16, 48, 0.82);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  background-image: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 100%);
  color: var(--ink);
  font-family: var(--f-body);
  font-weight: 500;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-user-select: none;
  user-select: none;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; }
header {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding-top: 10px;
}
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat small { font-size: 11px; letter-spacing: 0.12em; color: var(--mute); white-space: nowrap; }
.stat b { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--lantern); }
.stat.best b, .stat.spd b { font-size: 18px; color: var(--ink); }
.lives { display: flex; gap: 6px; align-items: center; height: 28px; }
.lives i { width: 14px; height: 14px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px var(--ember); transition: opacity .25s, transform .25s; }
.lives i.off { opacity: .18; transform: scale(.7); box-shadow: none; }
main { position: relative; flex: 1; min-height: 0; margin-bottom: 8px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#panel {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  width: min(100%, 320px); box-sizing: border-box;
  background: var(--panel); border: 1px solid rgba(255, 211, 107, 0.35);
  border-radius: 20px; padding: 22px 20px; text-align: center;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; flex-direction: column; gap: 12px;
}
#panel h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 34px; letter-spacing: 0.04em; color: var(--lantern); text-wrap: balance; }
#panel p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink); }
#panel .rules { display: grid; gap: 6px; text-align: left; font-size: 13px; color: var(--mute); margin: 0; padding: 0; list-style: none; }
#panel .rules li { display: flex; align-items: center; gap: 10px; }
#panel .rules svg { flex: none; }
#score-out { font-family: var(--f-display); font-size: 44px; color: var(--lantern); font-variant-numeric: tabular-nums; line-height: 1.1; }
button#go {
  appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 17px;
  background: var(--lantern); color: var(--sky); padding: 14px 20px; border-radius: 999px;
}
button#go:active { transform: scale(.97); }
button#go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button#skip {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  appearance: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 12px;
  background: rgba(11, 16, 48, 0.6); color: var(--mute);
  border: 1px solid rgba(255, 211, 107, 0.35); border-radius: 999px; padding: 6px 14px;
}
button#skip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .lives i { transition: none; } }
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="stat"><small>スコア / 1000</small><b id="score">0</b></div>
    <div class="stat spd"><small>スピード</small><b id="spd">×1.0</b></div>
    <div class="stat best"><small>ベスト</small><b id="best">0</b></div>
    <div class="lives" id="lives" aria-label="残りライフ"><i></i><i></i><i></i></div>
  </header>
  <main>
    <canvas id="cv"></canvas>
    <button id="skip" type="button" hidden>スキップ</button>
    <section id="panel">
      <h1 id="p-title">星キャッチ</h1>
      <div id="p-body">
        <p>指で左右になぞって、バスケットで流れ星を受け止めよう。</p>
      </div>
      <ul class="rules" id="rules">
        <li><svg width="18" height="18" viewBox="-10 -10 20 20"><polygon fill="#ffd36b" points="0,-9 2.6,-3 9,-2.8 4,1.5 5.6,8 0,4.5 -5.6,8 -4,1.5 -9,-2.8 -2.6,-3"/></svg>星は1点</li>
        <li><svg width="18" height="18" viewBox="-10 -10 20 20"><polygon fill="#fff4c4" stroke="#ffb020" stroke-width="1.5" points="0,-9 2.6,-3 9,-2.8 4,1.5 5.6,8 0,4.5 -5.6,8 -4,1.5 -9,-2.8 -2.6,-3"/></svg>白い大きな星は5点</li>
        <li><svg width="18" height="18" viewBox="-10 -10 20 20"><circle r="7" fill="#ff6a4d"/></svg>赤い隕石に3回当たるとおしまい</li>
        <li><svg width="18" height="18" viewBox="-10 -10 20 20"><polygon fill="none" stroke="#ffd36b" stroke-width="1.5" points="0,-9 2.6,-3 9,-2.8 4,1.5 5.6,8 0,4.5 -5.6,8 -4,1.5 -9,-2.8 -2.6,-3"/></svg>1000点でクリア。点が増えるほど星が速くなります</li>
      </ul>
      <button id="go" type="button">はじめる</button>
    </section>
  </main>
</div>

<script>
(function () {
  var GOAL = 1000;
  var CLEAR_MSG_1 = "あなたは", CLEAR_MSG_2 = "スターになりました♡";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var elScore = document.getElementById("score");
  var elSpd = document.getElementById("spd");
  var elBest = document.getElementById("best");
  var elLives = document.getElementById("lives").children;
  var panel = document.getElementById("panel");
  var pTitle = document.getElementById("p-title");
  var pBody = document.getElementById("p-body");
  var rules = document.getElementById("rules");
  var goBtn = document.getElementById("go");
  var skipBtn = document.getElementById("skip");

  var W = 0, H = 0, dpr = 1, u = 1;
  var state = "idle"; // idle | play | over | ending
  var score = 0, lives = 3, best = 0;
  var items = [], parts = [], bgStars = [];
  var spawnT = 0, flash = 0, last = 0;
  var cat = { x: 0, tx: 0 };
  var keys = { l: false, r: false };

  // ending
  var endT = 0, endDone = false, transformed = false, fwT = 0, wf = 0, credits = [];
  var CREDIT_START = 9.2;

  try { best = parseInt(localStorage.getItem("hoshi-best") || "0", 10) || 0; } catch (e) {}
  elBest.textContent = best;

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  function resize() {
    var r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    u = Math.max(0.8, Math.min(W / 400, 1.4));
    if (!cat.x) { cat.x = cat.tx = W / 2; }
    cat.tx = Math.min(Math.max(cat.tx, 0), W);
    bgStars = [];
    for (var i = 0; i < 60; i++) {
      bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28 });
    }
  }
  if (window.ResizeObserver) { new ResizeObserver(resize).observe(cv); }
  window.addEventListener("resize", resize);
  resize();

  /* ---------- audio (ending music) ---------- */
  var ac = null, master = null;
  function initAudio() {
    try {
      if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
  }
  function midi(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  function tone(f, t, d, type, v) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + d + 0.05);
  }
  function playMusic() {
    if (!ac) return;
    try {
      master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
      var t0 = ac.currentTime + 0.15, beat = 0.75, bar = beat * 4;
      var chords = [[48, 52, 55, 60, 64, 67], [43, 47, 50, 55, 59, 62], [45, 48, 52, 57, 60, 64], [41, 45, 48, 53, 57, 60]];
      var mel = [[76, 79, 81, 79], [74, 79, 83, 79], [76, 81, 79, 76], [77, 81, 84, 81]];
      var pat = [0, 1, 2, 3, 4, 5, 4, 3];
      for (var r = 0; r < 2; r++) {
        for (var c = 0; c < 4; c++) {
          var tb = t0 + (r * 4 + c) * bar, ch = chords[c];
          tone(midi(ch[0] - 12), tb, bar * 0.98, "sine", 0.10);
          for (var k = 0; k < 8; k++) tone(midi(ch[pat[k]]), tb + k * beat / 2, 0.5, "triangle", 0.045);
          for (var m = 0; m < 4; m++) tone(midi(mel[c][m]), tb + m * beat, 0.9, "sine", r ? 0.075 : 0.055);
        }
      }
      var tf = t0 + 8 * bar;
      [48, 55, 60, 64, 67, 72, 76].forEach(function (n, i) { tone(midi(n), tf + i * 0.04, 4.5, "sine", 0.07); });
      tone(midi(84), tf, 4.5, "sine", 0.06);
    } catch (e) {}
  }
  function stopMusic() {
    if (!master || !ac) { master = null; return; }
    try { master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(0, ac.currentTime, 0.12); } catch (e) {}
    master = null;
  }

  function setLives() {
    for (var i = 0; i < elLives.length; i++) { elLives[i].className = i < lives ? "" : "off"; }
  }

  /* ---------- speed: faster as the score grows ---------- */
  function speedBase(s) { return 130 + 230 * (1 - Math.exp(-s / 60)) + Math.min(s, GOAL) * 0.25; }
  function setSpd() { elSpd.textContent = "×" + (speedBase(score) / 130).toFixed(1); }

  function spawn() {
    var r = Math.random(), type = "star";
    if (state === "play") {
      if (r < 0.22) type = "meteor"; else if (r > 0.94) type = "gold";
    }
    var size = (type === "gold" ? 15 : type === "meteor" ? 13 : 11) * u;
    var base = (speedBase(state === "play" ? score : 0) + Math.random() * 70) * Math.max(0.7, Math.min(H / 650, 1.5));
    items.push({
      type: type, size: size,
      x: size + Math.random() * (W - size * 2), y: -size * 2,
      vy: state === "play" ? base : base * 0.55,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 3
    });
  }

  function burst(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, s = 60 + Math.random() * 140;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.5 + Math.random() * 0.3, t: 0, c: color });
    }
  }

  var fwCols = ["#ffd36b", "#ff8fc7", "#7fd6ff", "#fff4c4", "#ff6a4d", "#b9a0ff"];
  function firework(x, y, n) {
    var c = fwCols[(Math.random() * fwCols.length) | 0];
    for (var i = 0; i < n; i++) {
      var a = i / n * 6.283 + Math.random() * 0.2, s = 70 + Math.random() * 120;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.0 + Math.random() * 0.5, t: 0, c: c, s: 3.5, g: 70 });
    }
  }

  function updateParts(dt) {
    for (var j = parts.length - 1; j >= 0; j--) {
      var p = parts[j];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g === undefined ? 260 : p.g) * dt;
      if (p.t > p.life) parts.splice(j, 1);
    }
  }

  function starPath(r) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = i % 2 === 0 ? r : r * 0.45;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * rad, py = Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function saveBest() {
    var isBest = score > best;
    if (isBest) {
      best = score; elBest.textContent = best;
      try { localStorage.setItem("hoshi-best", String(best)); } catch (e) {}
    }
    return isBest;
  }

  function startGame() {
    stopMusic();
    score = 0; lives = 3; items = []; parts = []; spawnT = 0.2;
    endDone = false; transformed = false; wf = 0; flash = 0;
    elScore.textContent = "0"; setLives(); setSpd();
    skipBtn.hidden = true;
    state = "play"; panel.hidden = true;
  }

  function endGame() {
    state = "over";
    var isBest = saveBest();
    pTitle.textContent = "おしまい";
    pBody.innerHTML = '<div id="score-out">' + score + '</div><p>' + (isBest ? "ベスト更新です。" : "ベストは " + best + " 点です。") + '</p>';
    rules.hidden = true;
    goBtn.textContent = "もう一度";
    panel.hidden = false;
  }

  /* ---------- ending ---------- */
  function startEnding() {
    saveBest();
    state = "ending"; endT = 0; endDone = false; transformed = false; fwT = 0; wf = 0; flash = 0;
    items = [];
    panel.hidden = true; skipBtn.hidden = false;
    credits = [
      { t: "星キャッチ", big: true },
      { t: "" },
      { t: "あそんでくれて" },
      { t: "ありがとう" },
      { t: "" },
      { t: "スコア " + score },
      { t: "" },
      { t: "たくさんの星をつかまえた" },
      { t: "あなたは夜空のスターです" },
      { t: "" },
      { t: "THE END ♡", big: true }
    ];
    burst(cat.x, basketY(), "#fff4c4", 24);
    initAudio(); playMusic();
  }

  function finishEnding() {
    endDone = true;
    skipBtn.hidden = true;
    pTitle.textContent = "クリア!";
    pBody.innerHTML = '<div id="score-out">' + score + '</div><p>' + CLEAR_MSG_1 + CLEAR_MSG_2 + '</p>';
    rules.hidden = true;
    goBtn.textContent = "もう一度";
    panel.hidden = false;
  }

  function creditMetrics() {
    var lineH = 40 * u, speed = 56 * u, start = H + 30;
    return { lineH: lineH, speed: speed, start: start, limit: start + (credits.length - 1) * lineH - H * 0.5 };
  }

  function basketY() {
    var base = H - 58 * u;
    if (state !== "ending") return base;
    var k = clamp(endT / 2.5, 0, 1);
    k = 1 - Math.pow(1 - k, 3);
    return base + (H * 0.38 - base) * k;
  }

  function updateEnding(dt) {
    endT += dt;
    cat.x += (W / 2 - cat.x) * Math.min(1, dt * 6);
    updateParts(dt);
    if (wf > 0) wf = Math.max(0, wf - dt * 1.4);
    if (endT < 2.5 && Math.random() < dt * 50) {
      parts.push({ x: cat.x + (Math.random() - 0.5) * 60 * u, y: basketY() + 10 * u, vx: (Math.random() - 0.5) * 30, vy: 20 + Math.random() * 40, life: 0.6, t: 0, c: "#fff4c4", s: 3, g: 0 });
    }
    if (!transformed && endT >= 2.5) {
      transformed = true; wf = 1;
      burst(W / 2, H * 0.38, "#fff4c4", 40);
      firework(W * 0.3, H * 0.25, 28); firework(W * 0.7, H * 0.3, 28);
    }
    if (transformed) {
      fwT -= dt;
      if (fwT <= 0) {
        fwT = 0.45 + Math.random() * 0.4;
        firework(W * (0.15 + Math.random() * 0.7), H * (0.1 + Math.random() * 0.5), 26);
      }
    }
    if (!endDone) {
      var m = creditMetrics();
      if ((endT - CREDIT_START) * m.speed >= m.limit + m.speed * 1.5) finishEnding();
    }
  }

  /* ---------- main update ---------- */
  function update(dt) {
    if (state === "ending") { updateEnding(dt); return; }

    var cw = 84 * u, cy = H - 58 * u;
    if (keys.l) cat.tx -= 520 * dt;
    if (keys.r) cat.tx += 520 * dt;
    cat.tx = Math.min(Math.max(cat.tx, cw / 2), W - cw / 2);
    if (state === "idle") { cat.tx = W / 2 + Math.sin(performance.now() / 900) * W * 0.28; }
    cat.x += (cat.tx - cat.x) * Math.min(1, dt * 18);

    spawnT -= dt;
    if (spawnT <= 0) {
      spawn();
      spawnT = state === "play" ? Math.max(0.28, 0.85 - score * 0.012) * (0.7 + Math.random() * 0.6) : 0.5;
    }

    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.vy * dt; it.rot += it.vr * dt;
      var caught = it.y > cy - 4 * u && it.y < cy + 22 * u && Math.abs(it.x - cat.x) < cw / 2 + it.size * 0.3;
      if (caught && state === "play") {
        if (it.type === "meteor") {
          lives--; flash = 0.35; setLives();
          burst(it.x, it.y, "#ff6a4d", 14);
          if (lives <= 0) { items.splice(i, 1); endGame(); continue; }
        } else {
          score += it.type === "gold" ? 5 : 1;
          elScore.textContent = score; setSpd();
          burst(it.x, it.y, it.type === "gold" ? "#fff4c4" : "#ffd36b", it.type === "gold" ? 16 : 9);
          if (score >= GOAL) { startEnding(); return; }
        }
        items.splice(i, 1); continue;
      }
      if (it.y > H + 40) { items.splice(i, 1); }
    }
    updateParts(dt);
    if (flash > 0) flash -= dt;
  }

  /* ---------- drawing ---------- */
  function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

  function drawEnding(now) {
    var cx = W / 2, cyS = H * 0.38, R = Math.min(W, H) * 0.2;
    if (transformed && !endDone) {
      var fade = 1 - clamp((endT - 8.2) / 1.0, 0, 1);
      if (fade > 0) {
        var inS = clamp((endT - 2.5) / 0.9, 0, 1);
        var s = easeOutBack(inS) * (1 + 0.04 * Math.sin(now / 300));
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(cx, cyS); ctx.rotate(Math.sin(now / 1200) * 0.08); ctx.scale(s, s);
        var g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
        g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#ffd36b");
        ctx.shadowColor = "#ffd36b"; ctx.shadowBlur = 40;
        starPath(R); ctx.fillStyle = g; ctx.fill();
        ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = "#fff4c4"; ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = clamp((endT - 3.4) / 1.0, 0, 1) * fade;
        var fs = Math.max(20, Math.min(40, W * 0.075));
        ctx.font = fs + 'px "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif';
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
        ctx.lineWidth = 6; ctx.strokeStyle = "rgba(11,16,48,0.85)"; ctx.fillStyle = "#ffd36b";
        var y1 = cyS + R * 1.35;
        ctx.strokeText(CLEAR_MSG_1, cx, y1); ctx.fillText(CLEAR_MSG_1, cx, y1);
        ctx.strokeText(CLEAR_MSG_2, cx, y1 + fs * 1.5); ctx.fillText(CLEAR_MSG_2, cx, y1 + fs * 1.5);
        ctx.restore();
      }
    }
    if (!endDone && endT >= CREDIT_START) {
      var m = creditMetrics();
      var off = Math.min((endT - CREDIT_START) * m.speed, m.limit);
      ctx.save();
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
      for (var i = 0; i < credits.length; i++) {
        var ln = credits[i];
        if (!ln.t) continue;
        var y = m.start + i * m.lineH - off;
        if (y < -40 || y > H + 40) continue;
        ctx.globalAlpha = clamp(y / (H * 0.12), 0, 1) * clamp((H - y) / (H * 0.1), 0, 1);
        if (ln.big) {
          ctx.font = (28 * u) + 'px "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif';
          ctx.fillStyle = "#ffd36b";
        } else {
          ctx.font = '700 ' + (17 * u) + 'px "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif';
          ctx.fillStyle = "#f3efe2";
        }
        ctx.fillText(ln.t, W / 2, y);
      }
      ctx.restore();
    }
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var i;
    for (i = 0; i < bgStars.length; i++) {
      var b = bgStars[i];
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now / 700 + b.p);
      ctx.fillStyle = "#f3efe2";
      ctx.fillRect(b.x, b.y, b.r, b.r);
    }
    ctx.globalAlpha = 1;

    for (i = 0; i < items.length; i++) {
      var it = items[i];
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.type === "meteor") {
        var g = ctx.createLinearGradient(0, -it.size * 3.4, 0, 0);
        g.addColorStop(0, "rgba(255,106,77,0)"); g.addColorStop(1, "rgba(255,106,77,0.7)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(-it.size * 0.7, 0); ctx.lineTo(0, -it.size * 3.4); ctx.lineTo(it.size * 0.7, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ff6a4d";
        ctx.beginPath(); ctx.arc(0, 0, it.size * 0.8, 0, 6.28); ctx.fill();
        ctx.fillStyle = "#ffb199";
        ctx.beginPath(); ctx.arc(-it.size * 0.25, -it.size * 0.25, it.size * 0.28, 0, 6.28); ctx.fill();
      } else {
        ctx.rotate(it.rot);
        ctx.shadowColor = it.type === "gold" ? "#ffb020" : "#ffd36b";
        ctx.shadowBlur = 14;
        starPath(it.size);
        if (it.type === "gold") {
          ctx.fillStyle = "#fff4c4"; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = "#ffb020"; ctx.stroke();
        } else {
          ctx.fillStyle = "#ffd36b"; ctx.fill();
        }
      }
      ctx.restore();
    }

    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      var sz = p.s || 4;
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    if (state === "ending") drawEnding(now);

    // basket
    if (state !== "ending" || !transformed) {
      var cw = 84 * u, cy = basketY();
      ctx.save();
      ctx.translate(cat.x, cy);
      ctx.shadowColor = "rgba(255,211,107,0.55)"; ctx.shadowBlur = state === "ending" ? 30 : 18;
      ctx.fillStyle = "#ffd36b";
      ctx.beginPath();
      ctx.moveTo(-cw / 2, 0); ctx.lineTo(cw / 2, 0);
      ctx.quadraticCurveTo(cw * 0.42, 32 * u, 0, 32 * u);
      ctx.quadraticCurveTo(-cw * 0.42, 32 * u, -cw / 2, 0);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#0b1030"; ctx.lineWidth = 2; ctx.globalAlpha = 0.35;
      for (var k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(k * cw * 0.2, 4 * u); ctx.lineTo(k * cw * 0.12, 28 * u); ctx.stroke();
      }
      ctx.restore();
    }

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,106,77," + (flash * 0.9) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    if (wf > 0) {
      ctx.fillStyle = "rgba(255,244,196," + (wf * 0.85) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(function (t) { last = t; loop(t); });

  function pointerX(e) {
    var r = cv.getBoundingClientRect();
    cat.tx = e.clientX - r.left;
  }
  cv.addEventListener("pointerdown", function (e) { if (state === "play") { pointerX(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} } });
  cv.addEventListener("pointermove", function (e) { if (state === "play") pointerX(e); });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") keys.l = true;
    if (e.key === "ArrowRight") keys.r = true;
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft") keys.l = false;
    if (e.key === "ArrowRight") keys.r = false;
  });
  goBtn.addEventListener("click", function () { initAudio(); startGame(); });
  skipBtn.addEventListener("click", function () { stopMusic(); if (state === "ending" && !endDone) finishEnding(); });
  setLives(); setSpd();
})();
</script>
</body>
</html>
